<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khushi, our pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--card:#fffefb;--ink:#2b2a2e;--mute:#7a7580;--line:#ebe6dd;--rose:#c9566f;--indigo:#6a6fb3;--butter:#f3e7c2;--sage:#9db8a5}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.55;padding-top:env(safe-area-inset-top,0)}
header{text-align:center;padding:56px 16px 8px}
header h1{font:600 clamp(32px,7vw,56px)/1.1 Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
header p{font:500 clamp(19px,4vw,24px) Caveat,cursive;color:var(--mute);margin:10px 0 0}
.cd{position:fixed;top:calc(8px + env(safe-area-inset-top,0));right:8px;z-index:9;background:#fffefbee;border:1px solid var(--line);border-radius:10px;padding:5px 11px;font:600 17px/1.2 Caveat,cursive;text-align:right;box-shadow:0 4px 12px #4a3f2a1a}.cd b{font:600 15px Nunito,sans-serif;font-variant-numeric:tabular-nums;color:var(--rose)}
.intro{font:600 22px/1.3 Caveat,cursive;margin:0 0 10px}
.note{position:sticky;top:64px;z-index:5;max-width:500px;margin:20px auto;padding:14px 20px 12px;background:var(--butter);border-radius:4px;transform:rotate(-1deg);box-shadow:0 6px 18px #5a4a2a1f;font:700 23px/1.2 Caveat,cursive;min-height:80px;display:flex;flex-direction:column;justify-content:center;transition:opacity .5s}
.note small{font:500 17px Caveat,cursive;color:var(--mute);margin-top:4px}
.note.f{opacity:0}
.book{max-width:820px;margin:0 auto;padding:12px 14px calc(70px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:40px}
.page{position:relative;padding:34px 24px 26px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 28px #4a3f2a14;border-radius:4px;scroll-margin-top:110px}
.page::before{content:"";position:absolute;top:-11px;left:50%;width:96px;height:22px;transform:translateX(-50%) rotate(var(--tr,-2deg));background:var(--tape);opacity:.55}
.page:nth-child(odd){transform:rotate(-.3deg)}.page:nth-child(even){transform:rotate(.3deg)}
.c1{--tape:#e8b8c4}.c2{--tape:#bfd5c6}.c3{--tape:#efdca0}.c4{--tape:#cfc6e6}.c5{--tape:#bcd3e6}
.pn{position:absolute;right:16px;top:12px;font:700 19px Caveat,cursive;color:var(--mute)}
.new{position:absolute;left:14px;top:12px;background:var(--rose);color:#fff;font:700 18px Caveat,cursive;padding:0 11px;border-radius:99px}
h2{font:600 clamp(25px,5vw,34px)/1.15 Fraunces,Georgia,serif;margin:8px 0 2px}
.sub{font:500 21px/1.25 Caveat,cursive;margin:0 0 16px;color:var(--mute)}
.cap{font:500 21px/1.3 Caveat,cursive;margin:14px 0 0}
.fine{font-size:12px;color:var(--mute);margin-top:8px}
.cv{position:relative;height:270px;margin-top:6px}
.big{font:600 clamp(48px,13vw,88px)/1 Fraunces,Georgia,serif;color:var(--rose);margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;justify-content:space-around}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 16px;text-align:center;min-width:130px;flex:1}
.stat b{display:block;font:600 28px Fraunces,Georgia,serif}
.stat span{font:500 18px Caveat,cursive;color:var(--mute)}
.bub{max-width:80%;padding:7px 13px;border-radius:14px;margin:5px 0}
.bub.khushi{background:#f6e3e8;margin-right:auto}.bub.harshil{background:#e6e8f5;margin-left:auto}
.bub i{display:block;font:600 16px Caveat,cursive;color:var(--mute);font-style:normal}
.tog button{font:700 18px Caveat,cursive;border:1px solid var(--ink);background:none;padding:2px 14px;margin-right:6px;cursor:pointer;border-radius:99px}
.tog button.on{background:var(--ink);color:#fff}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:10px;color:var(--mute)}
.heat div{aspect-ratio:1;background:var(--rose);border-radius:2px}
.heat .l{background:none;aspect-ratio:auto;display:flex;align-items:center}
.cal{overflow-x:auto;padding-bottom:6px}
.cal div.g{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,10px);grid-auto-columns:10px;gap:2px;width:max-content}
.cal i{display:block;border-radius:2px;background:#0000000a}
.gap{background:var(--bg);border-left:3px solid var(--rose);padding:10px 14px;margin:10px 0}
.gap b{font:600 19px Fraunces,Georgia,serif}.gap q{display:block;font:600 21px/1.2 Caveat,cursive;margin-top:4px;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chips span{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:20px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wall div{background:var(--butter);padding:10px;font:700 20px/1.15 Caveat,cursive;transform:rotate(var(--r));box-shadow:0 4px 10px #5a4a2a1a;border-radius:2px}
.wall div small{display:block;font-size:15px;color:var(--mute);margin-top:4px}
.lock{border:1.5px dashed #c9c2b4;color:var(--mute);text-align:center;padding:26px 16px;font:500 24px Caveat,cursive;border-radius:6px}
.bday{text-align:center}
.bday .letter{font:600 25px/1.35 Caveat,cursive;max-width:520px;margin:12px auto;text-align:left}
@media(prefers-reduced-motion:reduce){.note{transition:none}}
@media(max-width:520px){.page{padding:30px 14px 20px}.cv{height:240px}}
</style>
</head>
<body>
<header><h1>Khushi,<br>this one is for you</h1><p id="hd"></p></header>
<div class="cd" id="cd"></div>
<div class="note" id="note"></div>
<main class="book" id="book"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="data.js"></script>
<script>
/* ---------- things you can edit ---------- */
const START='2023-06-27';
const MILESTONES={anniv:'2023-11-18',aug1:['2023-08-01','2024-08-01'],tripDate:null /* set to 'YYYY-MM-DD' of the trip start to show its message count */};
const LETTER="Khushi, I counted the days, the calls and the sorrys, and every number ended up pointing back to you. Happy birthday. This was never the last page, just the last one of this book.";
/* ----------------------------------------- */
const D=DATA,K='#c9566f',H='#6a6fb3',MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const n=x=>Math.round(x).toLocaleString('en-IN');
const ml=m=>MO[+m.slice(5)-1]+" '"+m.slice(2,4);
const dl=d=>{const[y,m,x]=d.split('-');return +x+' '+MO[+m-1]+' '+y};
const months=Object.keys(D.monthly);
const istToday=()=>new URLSearchParams(location.search).get('day')||new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());
const days=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
Chart.defaults.font.family='Nunito,sans-serif';Chart.defaults.color='#4a4650';Chart.defaults.borderColor='#ebe6dd';
const E=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
function chart(root,cfg,cls=''){const w=E(`<div class="cv ${cls}"><canvas></canvas></div>`);root.append(w);cfg.options=Object.assign({responsive:true,maintainAspectRatio:false},cfg.options);return new Chart(w.firstChild,cfg)}
const cap=(r,t)=>r.append(E(`<p class="cap">${t}</p>`));
const stat=(v,l,r)=>`<div class="stat" style="--r:${r||0}deg"><b>${v}</b><span>${l}</span></div>`;
const kwT=(k,w)=>D.kw[k][w].total;
const series=(k,w)=>months.map(m=>D.kw[k][w].monthly[m]||0);
const two=(k)=>[{label:'Khushi',data:series(k,'khushi'),borderColor:K,backgroundColor:K,tension:.3,pointRadius:0,borderWidth:3},{label:'Harshil',data:series(k,'harshil'),borderColor:H,backgroundColor:H,tension:.3,pointRadius:0,borderWidth:2}];
const lineOpt={scales:{x:{ticks:{maxTicksLimit:8,autoSkip:true}}},interaction:{mode:'index',intersect:false}};
const yr=m=>m.slice(0,4);
const daily=Object.entries(D.daily);

const PAGES=[
['2026-10-04','Day one','The very first messages, 27 June 2023',(r)=>{
 r.append(E(`<p class="intro">This is our chat from the first message, turned into a scrapbook with charts. A new page opens every day at 12:00 am IST until your birthday on 27 October. Everything in it comes from what we actually wrote.</p>`));
 r.append(E(`<div class="big">${n(days(START,istToday())+1)} days</div>`));cap(r,'since 27 June 2023, 12:53 pm, when we started talking. This is how it began:');
 D.day1.slice(0,10).forEach(m=>r.append(E(`<div class="bub ${m.who}"><i>${m.who=='khushi'?'Khushi':'Harshil'}</i>${m.t}</div>`)))}],
['2026-10-05','Every single day','Messages, days and a streak',(r)=>{
 const m=D.meta,sd=m.streak_start,ed=new Date(Date.parse(sd)+(m.streak-1)*864e5).toISOString().slice(0,10);
 r.append(E(`<div class="row">${stat(n(m.total),'messages',-2)}${stat(n(m.active_days)+' / '+n(m.span_days),'days we talked',2)}${stat(m.streak+' days','longest streak in a row',-1)}</div>`));
 chart(r,{type:'doughnut',data:{labels:['Khushi','Harshil'],datasets:[{data:[m.by.khushi,m.by.harshil],backgroundColor:[K,H]}]}});
 cap(r,`Khushi ${n(m.by.khushi)}, Harshil ${n(m.by.harshil)}. Almost perfectly even. The streak ran ${dl(sd)} to ${dl(ed)}.`)}],
['2026-10-06','Our months','Messages per month, who sent them',(r)=>{
 chart(r,{type:'bar',data:{labels:months.map(ml),datasets:[{label:'Khushi',data:months.map(m=>D.monthly[m].khushi),backgroundColor:K},{label:'Harshil',data:months.map(m=>D.monthly[m].harshil),backgroundColor:H}]},options:{scales:{x:{stacked:true,ticks:{maxTicksLimit:10}},y:{stacked:true}}}});
 const t=months.map(m=>[m,D.monthly[m].khushi+D.monthly[m].harshil]).filter(x=>x[0]<'2026-10').sort((a,b)=>b[1]-a[1])[0];
 cap(r,`Our loudest month: ${ml(t[0])}, ${n(t[1])} messages.`)}],
['2026-10-07','When we talk','Hour by hour, day by day',(r)=>{
 const box=E('<div></div>'),tg=E('<div class="tog"><button class="on">Khushi</button><button>Harshil</button></div>'),g=E('<div class="heat"></div>');
 r.append(tg,box);box.append(g);const dn=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 const draw=w=>{g.innerHTML='';const h=D.heat[w],mx=Math.max(...h.flat());g.append(E('<div class="l"></div>'));for(let i=0;i<24;i++)g.append(E(`<div class="l" style="aspect-ratio:auto">${i%6?'':i}</div>`));
  h.forEach((row,d)=>{g.append(E(`<div class="l">${dn[d]}</div>`));row.forEach((v,i)=>g.append(E(`<div title="${v}" style="opacity:${.06+.94*v/mx};background:${w=='khushi'?K:H}"></div>`)))})};
 tg.onclick=e=>{if(e.target.tagName!='BUTTON')return;[...tg.children].forEach(b=>b.classList.toggle('on',b==e.target));draw(e.target.textContent.toLowerCase())};draw('khushi');
 cap(r,'Darker means more messages. Tap a name to switch.')}],
['2026-10-08','Late nights','Messages sent between 12 am and 5 am',(r)=>{
 chart(r,{type:'bar',data:{labels:['Khushi','Harshil'],datasets:[{data:[D.night.khushi,D.night.harshil],backgroundColor:[K,H]}]},options:{plugins:{legend:{display:false}}}});
 cap(r,`${n(D.night.khushi+D.night.harshil)} messages while the world slept. Khushi ${n(D.night.khushi)}, Harshil ${n(D.night.harshil)}.`)}],
['2026-10-09','Calls','Every call with a recorded time',(r)=>{
 const c=D.calls;r.append(E(`<div class="row">${stat(n(c.n),'calls',-2)}${stat(n(c.hours)+' h','talked',2)}${stat(c.longest_min+' min','longest call, '+dl(c.longest_date),-1)}</div>`));
 chart(r,{type:'bar',data:{labels:Object.keys(c.monthly).map(ml),datasets:[{label:'Hours on call',data:Object.values(c.monthly).map(v=>v.h),backgroundColor:K}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:10}}}}});
 cap(r,`${c.video} of them were video calls.`)}],
['2026-10-10','Good mornings, good nights','How we open and close the day',(r)=>{
 chart(r,{type:'bar',data:{labels:['Good morning','Good night'],datasets:[{label:'Khushi',data:[kwT('gm','khushi'),kwT('gn','khushi')],backgroundColor:K},{label:'Harshil',data:[kwT('gm','harshil'),kwT('gn','harshil')],backgroundColor:H}]}});
 cap(r,'Counted as messages containing "good morning/gm" or "good night/gn".')}],
['2026-10-11','Who says hi first','The first message of each day',(r)=>{
 const f=D.first_texter;chart(r,{type:'doughnut',data:{labels:['Khushi','Harshil'],datasets:[{data:[f.khushi,f.harshil],backgroundColor:[K,H]}]}});
 cap(r,`Khushi opened the day on ${n(f.khushi)} days. Harshil on ${n(f.harshil)}. Thank you for always starting it.`)}],
['2026-10-12','How she looks after me','Little care words, counted',(r)=>{
 const items=[['khana','Khana / khaya'],['sojao','So ja'],['reach','Reach'],['dawai','Dawai / medicine'],['paani','Paani / water'],['tc','Take care']];
 chart(r,{type:'bar',data:{labels:items.map(i=>i[1]),datasets:[{label:'Khushi',data:items.map(i=>kwT(i[0],'khushi')),backgroundColor:K},{label:'Harshil',data:items.map(i=>kwT(i[0],'harshil')),backgroundColor:H}]},options:{indexAxis:'y'}},'');
 cap(r,'Messages that contain those words. Khushi asked "khana khaya?" more often than anyone.');r.append(E('<p class="fine">Search words are listed in data.js under "rx".</p>'))}],
['2026-10-13','I love you, I miss you','Month by month',(r)=>{
 chart(r,{type:'line',data:{labels:months.map(ml),datasets:two('love')},options:lineOpt});
 cap(r,`"Love you" in ${n(kwT('love','khushi'))} of her messages.`);
 chart(r,{type:'line',data:{labels:months.map(ml),datasets:two('miss')},options:lineOpt});
 cap(r,`"Miss you" or "yaad" in ${n(kwT('miss','khushi'))} of hers.`)}],
['2026-10-14','Her emojis','What Khushi says without words',(r)=>{
 const skip='♀♂🏻🏼🏽🏾🏿';const f=(a)=>a.filter(e=>!skip.includes(e[0])).slice(0,7);
 r.append(E(`<div class="chips">${f(D.emoji.khushi).map(e=>`<span>${e[0]} ${n(e[1])}</span>`).join('')}</div>`));
 cap(r,'Hers.');r.append(E(`<div class="chips">${f(D.emoji.harshil).map(e=>`<span>${e[0]} ${n(e[1])}</span>`).join('')}</div>`));cap(r,'Mine.')}],
['2026-10-15','Sorry and gussa','The rough patches, honestly',(r)=>{
 const s=(k)=>months.map(m=>(D.kw[k].khushi.monthly[m]||0)+(D.kw[k].harshil.monthly[m]||0));
 chart(r,{type:'bar',data:{labels:months.map(ml),datasets:[{label:'sorry / maaf',data:s('sorry'),backgroundColor:K},{label:'gussa / naraz',data:s('gussa'),backgroundColor:'#d9a441'}]},options:{scales:{x:{stacked:true,ticks:{maxTicksLimit:10}},y:{stacked:true}}}});
 cap(r,`Sorry: Khushi ${kwT('sorry','khushi')}, Harshil ${kwT('sorry','harshil')}. Gussa/naraz: Khushi ${kwT('gussa','khushi')}, Harshil ${kwT('gussa','harshil')}. And still we kept coming back.`)}],
['2026-10-16','The quiet days','Days with no messages at all',(r)=>{
 const by={};D.silent_days.forEach(d=>by[yr(d)]=(by[yr(d)]||0)+1);
 chart(r,{type:'bar',data:{labels:Object.keys(by),datasets:[{data:Object.values(by),backgroundColor:'#a79bd1'}]},options:{plugins:{legend:{display:false}}}});
 cap(r,`${D.silent_days.length} quiet days in ${n(D.meta.span_days)}. The other ${n(D.meta.active_days)} had us.`)}],
['2026-10-17','Coming back, part one','The longest silences and who ended them',(r)=>comeback(r,0)],
['2026-10-18','Coming back, part two','And the ones after',(r)=>comeback(r,1)],
['2026-10-19','Dates that matter','Pinned on the map',(r)=>{
 const dd=d=>D.daily[d]||0;
 r.append(E(`<div class="row">${stat(dl(START),'first "Hey"',-2)}${stat(dl(MILESTONES.anniv),'our anniversary, '+n(dd(MILESTONES.anniv))+' messages that day',2)}</div>`));
 r.append(E(`<div class="row" style="margin-top:12px">${MILESTONES.aug1.map(d=>stat(dl(d),n(dd(d))+' messages',-1)).join('')}${stat('Summer 2024','our first trip together'+(MILESTONES.tripDate?', '+n(dd(MILESTONES.tripDate))+' messages on day one':''),1)}</div>`));
 chart(r,{type:'line',data:{labels:months.map(ml),datasets:[{data:months.map(m=>D.monthly[m].khushi+D.monthly[m].harshil),borderColor:K,backgroundColor:'#c9566f2e',fill:true,tension:.3,pointRadius:0}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:8}}}}})}],
['2026-10-20','Every day, in color','One square per day since 27 June 2023',(r)=>{
 const w=E('<div class="cal"><div class="g"></div></div>'),g=w.firstChild,mx=Math.max(...Object.values(D.daily));
 const s=new Date(START+'T00:00:00Z'),pad=(s.getUTCDay()+6)%7;for(let i=0;i<pad;i++)g.append(E('<i style="background:none"></i>'));
 for(let i=0;i<=D.meta.span_days;i++){const d=new Date(s.getTime()+i*864e5).toISOString().slice(0,10),v=D.daily[d]||0;g.append(E(`<i title="${dl(d)}: ${v}" style="${v?`background:${K};opacity:${.2+.8*v/mx}`:''}"></i>`))}
 r.append(w);setTimeout(()=>w.scrollLeft=9999,50);cap(r,'Swipe sideways. Pink means we talked, darker means a lot.')}],
['2026-10-21','Our busiest days','Top ten, by messages',(r)=>{
 const t=daily.filter(x=>x[0]<istToday()).sort((a,b)=>b[1]-a[1]).slice(0,10);
 chart(r,{type:'bar',data:{labels:t.map(x=>dl(x[0])),datasets:[{data:t.map(x=>x[1]),backgroundColor:K}]},options:{indexAxis:'y',plugins:{legend:{display:false}}}},'');
 cap(r,`On ${dl(t[0][0])} we sent ${n(t[0][1])} messages in one day.`)}],
['2026-10-22','In your words','Things Khushi actually wrote',(r)=>{
 const w=E('<div class="wall"></div>');D.notes.slice(0,24).forEach((x,i)=>w.append(E(`<div style="--r:${(i%5-2)*1.3}deg">${x.t}<small>${dl(x.d)}</small></div>`)));r.append(w)}],
['2026-10-23','Year by year','Messages in each year',(r)=>{
 const y={};months.forEach(m=>y[yr(m)]=(y[yr(m)]||0)+D.monthly[m].khushi+D.monthly[m].harshil);
 chart(r,{type:'bar',data:{labels:Object.keys(y).map(k=>k=='2023'?'2023 (from Jun)':k=='2026'?'2026 (to Oct 4)':k),datasets:[{data:Object.values(y),backgroundColor:['#e4b3bf','#d58a9b',K,'#9e3f56']}]},options:{plugins:{legend:{display:false}}}})}],
['2026-10-24','Her clock','The hours Khushi texts most',(r)=>{
 const h=Array(24).fill(0);D.heat.khushi.forEach(row=>row.forEach((v,i)=>h[i]+=v));const p=h.indexOf(Math.max(...h));
 chart(r,{type:'line',data:{labels:h.map((_,i)=>i+':00'),datasets:[{data:h,borderColor:K,backgroundColor:'#c9566f2e',fill:true,tension:.4,pointRadius:0}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:8}}}}});
 cap(r,`Her busiest hour is ${p}:00 to ${p+1}:00.`)}],
['2026-10-25','Time on call','Adding up every hour',(r)=>{
 const c=D.calls,k=Object.keys(c.monthly);let t=0;
 r.append(E(`<div class="big">${n(c.hours)} hours</div>`));cap(r,`That is ${(c.hours/24).toFixed(1)} full days of just talking.`);
 chart(r,{type:'line',data:{labels:k.map(ml),datasets:[{data:k.map(m=>+(t+=c.monthly[m].h).toFixed(1)),borderColor:H,backgroundColor:'#6a6fb32e',fill:true,pointRadius:0}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:8}}}}})}],
['2026-10-26','The whole thing','Numbers, one last time',(r)=>{
 const m=D.meta,c=D.calls;
 r.append(E(`<div class="row">${stat(n(m.span_days),'days',-2)}${stat(n(m.total),'messages',2)}${stat(n(c.n),'calls',-1)}${stat(n(c.hours)+' h','on call',1)}${stat(m.streak,'day streak',-2)}${stat(n(kwT('love','khushi')+kwT('love','harshil')),'love yous',2)}</div>`));
 cap(r,'Tomorrow is your day. Come back at 12:00 am.')}],
['2026-10-27','Happy birthday, Khushi','27 October',(r)=>{r.classList.add('bday');r.append(E(`<div class="big">🎂</div><div class="letter">${LETTER}</div>`))}]
];
function comeback(r,part){
 const top=D.comebacks.slice(0,8).sort((a,b)=>a.back<b.back?-1:1),sl=top.slice(part*4,part*4+4);
 sl.forEach(c=>r.append(E(`<div class="gap"><b>${n(c.hours/24)} days quiet</b>, ${dl(c.from)} to ${dl(c.back)}<br>${c.who=='khushi'?'Khushi':'Harshil'} wrote first:<q>${c.text.replace(/</g,'&lt;')}${c.text.length>=90?'...':''}</q></div>`)));
 if(part==1){const w={khushi:0,harshil:0};D.comebacks.forEach(c=>w[c.who]++);
  chart(r,{type:'doughnut',data:{labels:['Khushi','Harshil'],datasets:[{data:[w.khushi,w.harshil],backgroundColor:[K,H]}]}});
  cap(r,`Across the ${D.comebacks.length} longest silences, Khushi broke ${w.khushi} and Harshil ${w.harshil}.`)}
}
/* ---------- render ---------- */
const book=document.getElementById('book'),done={};
function render(){
 const t=istToday(),open=PAGES.filter(p=>p[0]<=t),next=PAGES.find(p=>p[0]>t);
 document.getElementById('hd').textContent='Page '+open.length+' of '+PAGES.length;
 book.innerHTML='';
 if(next)book.append(E(`<div class="lock">Page ${open.length+1} opens ${dl(next[0])}, 12:00 am<br><b class="tick" data-t="${next[0]}"></b></div>`));
 open.map((p,i)=>[p,i]).reverse().forEach(([p,i])=>{
  const el=E(`<section class="page c${i%5+1}" id="p${i+1}" style="--tr:${(i%4-1.5)*2}deg">${i==open.length-1&&i>0?'<span class="new">new</span>':''}<span class="pn">page ${i+1}</span><h2>${p[1]}</h2><p class="sub">${p[2]}</p></section>`);
  book.append(el);
  if(i==open.length-1&&PAGES.length==open.length)el.classList.add('last');
  const io=new IntersectionObserver((e)=>{if(e[0].isIntersecting){io.disconnect();p[3](el)}},{rootMargin:'300px'});io.observe(el)});
}
render();setInterval(()=>{const a=document.querySelectorAll('.page').length;if(PAGES.filter(p=>p[0]<=istToday()).length!=a)render()},30000);
/* ---------- countdowns ---------- */
const ist=d=>Date.parse(d+'T00:00:00+05:30'),pad=v=>String(v).padStart(2,'0');
const hms=ms=>{ms=Math.max(0,ms)/1e3|0;const d=ms/86400|0;return (d?d+'d ':'')+pad(ms%86400/3600|0)+':'+pad(ms%3600/60|0)+':'+pad(ms%60)};
function tick(){const now=Date.now(),pv=new URLSearchParams(location.search).get('day');
 document.querySelectorAll('.tick').forEach(e=>e.textContent=pv?'':'in '+hms(ist(e.dataset.t)-now));
 const cd=document.getElementById('cd');if(pv){cd.style.display='none';return}
 const nx=PAGES.find(p=>ist(p[0])>now),bd=ist('2026-10-27');let s='';
 if(nx)s+=`Page ${PAGES.indexOf(nx)+1} in <b>${hms(ist(nx[0])-now)}</b><br>`;
 s+=now<bd?`Birthday in <b>${hms(bd-now)}</b>`:'Happy birthday';cd.innerHTML=s}
tick();setInterval(tick,1000);
/* ---------- rotating note, every 15 s ---------- */
const NL=[...D.firsts,...D.notes];let ni=0;const nb=document.getElementById('note');
function showNote(){const x=NL[ni++%NL.length];nb.classList.add('f');setTimeout(()=>{nb.innerHTML=`${x.t}<small>${x.who=='harshil'?'Harshil':'Khushi'}, ${dl(x.d)}${x.tag?', '+x.tag:''}</small>`;nb.classList.remove('f')},500)}
showNote();setInterval(showNote,15000);
</script>
